[build-system]
requires = ["hatchling>=1.26,<2", "hatch-requirements-txt>=0.4,<1"]
build-backend = "hatchling.build"

[project]
name = "vhe-deploy"
version = "0.1.0a3"
description = "VHE Deploy: SFTP/FTPS CLI and MCP server with verified backups and preview tokens"
keywords = ["sftp", "ftps", "mcp", "mcp-server", "deployment", "backup", "cli"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["dependencies"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/herlonventura/vhe-deploy-sftp-ftps-mcp"
Issues = "https://github.com/herlonventura/vhe-deploy-sftp-ftps-mcp/issues"

[project.scripts]
vhe-deploy = "vhe_deploy.cli:cli"
vhe-deploy-mcp = "vhe_deploy.mcp_server:main"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/vhe_deploy"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/src/vhe_deploy/**/*.py", "/pyproject.toml", "/requirements.txt", "/README.md", "/LICENSE"]
